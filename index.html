<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Inevstor — Недвижимость в Баку</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; margin: 0; background: #0f172a; color: white; }
    header { padding: 40px; text-align: center; background: #1e293b; }
    h1 { margin: 0; font-size: 32px; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #22c55e;
      color: black;
      text-decoration: none;
      border-radius: 8px;
    }
    section { padding: 30px; }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Inevstor</h1>
  <p>Недвижимость в Баку</p>
  <a class="btn" href="https://wa.me/">Связаться в WhatsApp</a>
</header>

<section>
  <h2>Объекты</h2>

  <div class="card">
    <h3>2-комнатная квартира</h3>
    <p>Цена: 120 000 AZN</p>
  </div>

  <div class="card">
    <h3>Новостройка</h3>
    <p>Цена: от 90 000 AZN</p>
  </div>

</section>

</body>
</html>
